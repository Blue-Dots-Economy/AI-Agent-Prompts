name: Prompt Tuner Regression

# Tier-3 standing regression (see repo CLAUDE.md, "The three testing tiers").
# Runs on GitHub's CLOUD infra, so it fires even when the dev machine is off.
#
# WHAT RUNS, AND WHEN (as of 2026-10-19):
#   - `nightly` (cron 21:30 UTC, nominally 03:00 IST; GitHub's cron queue can start it late):
#       1. the static script checks (static_regression.py + fix_presence.py), all bots;
#       2. LIVE test calls: raya/overnight/overnight_sweep.py dials every live bot (every
#          conversation target in raya/agents.json with a prod uuid) from the tester agent, one
#          case per bot first, then the extra cases, until the --hours budget runs out;
#       3. every transcript detector (run_runtime_checks.sh) over the calls made since step 2 began;
#       4. ONE email digest combining the live calls and the script checks.
#     This replaces the old 06:37 IST static-only email: one email per night, no duplicates.
#   - `static` runs only on demand (Run workflow -> mode: static). No calls, no secrets beyond email.
#
# Secrets: RAYA_BASE_URL + RAYA_API_TOKEN (live calls, detectors), GMAIL_OAUTH_* (email).
# This repo is PUBLIC: secrets are never echoed and are not passed to fork PRs (no PR trigger here).

on:
  schedule:
    - cron: "30 21 * * *"     # nightly live + static, ~03:00 IST
  workflow_dispatch:
    inputs:
      mode:
        description: "nightly = live calls + script checks + email; static = script checks + email"
        type: choice
        options: [nightly, static]
        default: nightly
      only:
        description: "Only these bot ids, comma-separated (blank = every live bot)"
        required: false
        default: ""
      max_cases:
        description: "Stop after this many calls (0 = no cap)"
        required: false
        default: "0"
      hours:
        description: "Time budget for placing calls, in hours"
        required: false
        default: "3"
      email:
        description: "Send the email digest"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: prompt-tuner-regression     # one tester agent: never two runs dialling at once
  cancel-in-progress: false

jobs:
  nightly:
    if: ${{ github.event_name == 'schedule' || inputs.mode == 'nightly' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330              # GitHub's hard cap is 360
    env:
      RAYA_BASE_URL: ${{ secrets.RAYA_BASE_URL }}
      RAYA_API_TOKEN: ${{ secrets.RAYA_API_TOKEN }}
      GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
      GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
      GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
      ONLY: ${{ inputs.only }}
      MAX_CASES: ${{ inputs.max_cases || '0' }}
      HOURS: ${{ inputs.hours || '3' }}
      SEND_EMAIL: ${{ github.event_name == 'schedule' || inputs.email }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare
        run: |
          test -n "$RAYA_API_TOKEN" || { echo "::error::RAYA_API_TOKEN secret is not set"; exit 1; }
          # Most detectors read raya/.env directly; materialise it from the secrets for this runner only
          # (git-ignored, never uploaded). Scripts that read the environment first ignore it.
          umask 077
          printf 'RAYA_BASE_URL=%s\nRAYA_API_TOKEN=%s\n' "$RAYA_BASE_URL" "$RAYA_API_TOKEN" > raya/.env
          SWEEP="$RUNNER_TEMP/sweep"; mkdir -p "$SWEEP"
          echo "SWEEP=$SWEEP" >> "$GITHUB_ENV"
          echo "CALLCACHE=$RUNNER_TEMP/callcache" >> "$GITHUB_ENV"
          pip install --quiet google-api-python-client google-auth

      - name: Script checks (static)
        run: |
          python3 raya/regression/static_regression.py || true
          python3 raya/regression/fix_presence.py > "$SWEEP/fix_presence.txt" 2>&1 || true
          tail -3 "$SWEEP/fix_presence.txt"

      - name: Live test calls
        run: |
          ARGS=(--hours "$HOURS" --passes 1 --coverage-first --no-phase-b --outdir "$SWEEP")
          [ -n "$ONLY" ] && ARGS+=(--only "$ONLY")
          [ "$MAX_CASES" != "0" ] && ARGS+=(--max-cases "$MAX_CASES")
          python3 raya/overnight/overnight_sweep.py --dry-run "${ARGS[@]}" | tail -30
          python3 raya/overnight/overnight_sweep.py "${ARGS[@]}" || echo "::warning::sweep exited non-zero"
          echo "---- calls.tsv"; cut -f1,5,6 "$SWEEP/calls.tsv" || true

      - name: Retire job posts made by tonight's test calls
        if: ${{ always() }}
        run: python3 raya/regression/retire_test_postings.py || echo "::warning::could not retire test postings"

      - name: Transcript detectors on tonight's calls
        if: ${{ always() }}
        run: |
          SINCE=$(python3 -c "import json;print(json.load(open('$SWEEP/meta.json'))['since'])" 2>/dev/null || date -u -d '-6 hours' +%Y-%m-%dT%H:%M:%S)
          echo "detectors since $SINCE UTC"
          bash raya/regression/run_runtime_checks.sh --since "$SINCE" > "$SWEEP/detectors.txt" 2>&1 || true
          tail -5 "$SWEEP/detectors.txt"

      - name: Grade calls and build the digest
        if: ${{ always() }}
        id: digest
        run: |
          python3 raya/regression/live_results.py --sweep-dir "$SWEEP" --detectors-log "$SWEEP/detectors.txt" \
            --cache "$CALLCACHE" --out raya/regression/live-report.json || echo "::warning::live_results failed"
          python3 raya/regression/build_digest.py nightly > digest.html
          echo "headline=$(python3 raya/regression/build_digest.py nightly --headline)" >> "$GITHUB_OUTPUT"
          {
            echo "## Nightly: $(python3 raya/regression/build_digest.py nightly --headline)"
            echo
            echo '```'
            cut -f1,5,6 "$SWEEP/calls.tsv" 2>/dev/null || echo "no calls.tsv"
            echo '```'
            cat raya/regression/latest-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-results
          path: |
            ${{ runner.temp }}/sweep
            raya/regression/live-report.json
            raya/regression/latest-report.md
            raya/regression/latest-report.json
            digest.html

      - name: Email digest
        if: ${{ always() && env.SEND_EMAIL == 'true' && env.GMAIL_OAUTH_REFRESH_TOKEN != '' }}
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          DIGEST_SUBJECT: "[Prompt Tuner] Nightly bot check: ${{ steps.digest.outputs.headline }}"
        run: python3 raya/regression/send_digest.py

      - name: Remove the runner's secret file
        if: ${{ always() }}
        run: rm -f raya/.env

  static:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'static' }}
    runs-on: ubuntu-latest
    env:
      GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
      GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
      GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
      SEND_EMAIL: ${{ inputs.email }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run static regression suite
        id: run
        run: |
          python3 raya/regression/static_regression.py || true
          python3 raya/regression/fix_presence.py || echo "FIX PRESENCE FAILURES (see log)"
          echo "headline=$(python3 raya/regression/build_digest.py daily --headline)" >> "$GITHUB_OUTPUT"

      - name: Build digest
        run: |
          python3 raya/regression/build_digest.py daily > digest.html
          cat raya/regression/latest-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: |
            raya/regression/latest-report.md
            raya/regression/latest-report.json

      - name: Email digest
        if: ${{ env.SEND_EMAIL == 'true' && env.GMAIL_OAUTH_REFRESH_TOKEN != '' }}
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          DIGEST_SUBJECT: "[Prompt Tuner] Script check: ${{ steps.run.outputs.headline }}"
        run: |
          pip install --quiet google-api-python-client google-auth
          python3 raya/regression/send_digest.py
