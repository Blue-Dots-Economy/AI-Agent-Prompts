<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Bot Control Center</title>
<style>
  :root{
    --bg:#070a0f; --bg2:#0b1017; --panel:#0e141d; --panel2:#111926;
    --line:#1b2634; --line2:#26374b; --txt:#dfe8f2; --dim:#8194ab; --faint:#55677d;
    --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --green:#3ad29f; --amber:#f5c451; --red:#ff6b6b; --blue:#5b9dff; --violet:#a98bff;
    --glow:0 0 0 1px var(--line2), 0 8px 30px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 700px at 78% -10%,#0f1a2b 0%,var(--bg) 55%);
    color:var(--txt);font-family:var(--sans);font-size:13.5px;-webkit-font-smoothing:antialiased;letter-spacing:.1px}
  .mono{font-family:var(--mono)}
  a{color:var(--blue);text-decoration:none}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#1c2836;border-radius:6px}

  header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:22px;
    padding:14px 22px;background:linear-gradient(180deg,rgba(9,13,19,.96),rgba(9,13,19,.82));
    border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);animation:pulse 2.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .brand h1{font-size:14px;font-weight:650;letter-spacing:2.5px;margin:0;text-transform:uppercase}
  .brand small{color:var(--faint);font-size:10.5px;letter-spacing:1.5px}
  .stat-strip{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 13px;min-width:74px;text-align:center}
  .stat .n{font-family:var(--mono);font-size:19px;font-weight:600;line-height:1}
  .stat .l{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1.2px;margin-top:4px}
  .stat.warn .n{color:var(--amber)} .stat.bad .n{color:var(--red)} .stat.good .n{color:var(--green)}
  .btn{background:var(--panel2);border:1px solid var(--line2);color:var(--txt);border-radius:8px;
    padding:8px 13px;font-size:12px;cursor:pointer;font-family:var(--sans);transition:.15s}
  .btn:hover{border-color:var(--blue);color:#fff}

  nav.tabs{display:flex;gap:2px;padding:0 22px;border-bottom:1px solid var(--line);background:var(--bg2)}
  .tab{padding:12px 16px;font-size:12px;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;letter-spacing:.6px}
  .tab.active{color:#fff;border-bottom-color:var(--blue)}
  .tab .c{font-family:var(--mono);color:var(--faint);margin-left:6px;font-size:11px}

  main{padding:20px 22px 60px}
  .grp-h{font-size:11px;color:var(--faint);letter-spacing:2px;text-transform:uppercase;margin:22px 0 11px;display:flex;align-items:center;gap:10px}
  .grp-h:before{content:"";height:1px;flex:0 0 18px;background:var(--line2)}
  .grp-h:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--line),transparent)}

  .fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:12px;padding:14px;cursor:pointer;transition:.16s;position:relative;overflow:hidden}
  .card:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--glow)}
  .card .idrow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .sdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .card .tid{font-family:var(--mono);font-size:13px;font-weight:600}
  .chip{font-size:9.5px;padding:2px 7px;border-radius:20px;border:1px solid var(--line2);color:var(--dim);letter-spacing:.5px;text-transform:uppercase}
  .chip.exp{border-color:#4a3a6b;color:var(--violet)}
  .card .meta{display:flex;justify-content:space-between;color:var(--faint);font-size:11px;margin-top:11px;font-family:var(--mono)}
  .pips{display:flex;gap:4px;align-items:center}
  .pip{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:6px;border:1px solid var(--line2)}
  .pip.p1{color:var(--red);border-color:#3a2230} .pip.ok{color:var(--green);border-color:#1c3a30}
  .sync{font-size:10px;letter-spacing:.8px;text-transform:uppercase;font-family:var(--mono)}

  /* issue board */
  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;align-items:start}
  .lane{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px}
  .lane h3{margin:2px 4px 10px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between}
  .lane h3 .k{font-family:var(--mono);color:var(--faint)}
  .icard{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:9px}
  .icard .t{font-size:12.5px;font-weight:550;line-height:1.35;margin-bottom:8px}
  .icard .r{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tag{font-size:9.5px;padding:2px 7px;border-radius:6px;background:#0c1420;border:1px solid var(--line2);color:var(--dim);font-family:var(--mono)}
  .tag.pri{color:var(--red)} .tag.bot{color:var(--blue)} .tag.dp{color:var(--violet)}
  .fixbtn{margin-left:auto;font-size:10px;padding:4px 10px;border-radius:6px;background:#12202f;border:1px solid var(--line2);color:var(--dim);cursor:pointer}
  .fixbtn:hover{border-color:var(--blue);color:#fff}

  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(3,6,10,.6);backdrop-filter:blur(2px);z-index:40;display:none}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,94vw);background:var(--bg2);
    border-left:1px solid var(--line2);z-index:50;transform:translateX(100%);transition:.22s;overflow-y:auto;padding:20px 22px}
  .drawer.open{transform:none} .scrim.open{display:block}
  .drawer h2{font-family:var(--mono);font-size:17px;margin:0 0 4px}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:5px 12px;margin:14px 0;font-size:12px}
  .kv b{color:var(--faint);font-weight:500}
  .sec{margin-top:20px} .sec h4{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);margin:0 0 9px}
  .row{display:flex;gap:10px;font-family:var(--mono);font-size:11.5px;padding:6px 0;border-bottom:1px solid var(--line)}
  .row .a{color:var(--faint);min-width:120px}
  .muted{color:var(--faint);font-size:12px}
  .loading{color:var(--faint);padding:40px;text-align:center;font-family:var(--mono)}
  .banner{margin:14px 22px 0;padding:9px 13px;border:1px dashed var(--line2);border-radius:8px;color:var(--dim);font-size:11.5px}
  .ebadge{font-size:10px;font-family:var(--mono);padding:3px 9px;border-radius:20px;border:1px solid var(--line2);letter-spacing:.6px}
  .ebadge.sim{color:var(--amber);border-color:#3a3420} .ebadge.real{color:var(--green);border-color:#173a2c}

  /* job console */
  .rail{display:flex;gap:0;margin:6px 0 18px;flex-wrap:wrap}
  .rstep{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--faint);font-family:var(--mono)}
  .rstep .b{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:10px;background:var(--panel)}
  .rstep.done .b{background:var(--green);color:#04120c;border-color:var(--green);box-shadow:0 0 10px rgba(58,210,159,.5)}
  .rstep.done{color:var(--txt)}
  .rstep.active .b{border-color:var(--blue);color:var(--blue);animation:pulse 1.3s infinite}
  .rstep.active{color:#fff}
  .rline{width:26px;height:1px;background:var(--line2);margin:0 3px}
  .log{background:#060a0f;border:1px solid var(--line);border-radius:9px;padding:12px;font-family:var(--mono);font-size:11.5px;line-height:1.7;max-height:300px;overflow-y:auto}
  .log .l-tool{color:var(--blue)} .log .l-text{color:var(--dim)} .log .l-res{color:var(--green)} .log .l-err{color:var(--red)}
  .gate{margin-top:16px;padding:14px;border:1px solid var(--amber);border-radius:10px;background:rgba(245,196,81,.05)}
  .gate h4{margin:0 0 6px;color:var(--amber);font-size:12px;letter-spacing:.5px}
  .gate .flags{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
  .gate .flag{font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:6px;border:1px solid #3a3420;color:var(--amber)}
  .gbtns{display:flex;gap:8px;margin-top:10px}
  .btn.go{border-color:var(--green);color:var(--green)} .btn.go:hover{background:rgba(58,210,159,.12)}
  .btn.no{border-color:var(--red);color:var(--red)} .btn.no:hover{background:rgba(255,107,107,.1)}
  .verdict{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin:4px 0 0}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="dot"></span>
    <div><h1>Bot Control Center</h1><small>Prompt Tuner · voice-agent fleet ops</small></div>
    <span class="ebadge sim" id="ebadge" title="">engine…</span>
  </div>
  <div class="stat-strip" id="stats"></div>
  <button class="btn" onclick="refresh()">↻ Refresh</button>
</header>
<div class="banner" id="engine-banner">Fix / Test engine: <b>offline</b> — the read cockpit is live; the Claude-Code job runner is the next phase (Fix buttons will stream here).</div>
<nav class="tabs">
  <div class="tab active" data-tab="fleet" onclick="tab('fleet')">Fleet <span class="c" id="c-fleet"></span></div>
  <div class="tab" data-tab="issues" onclick="tab('issues')">Issues <span class="c" id="c-issues"></span></div>
  <div class="tab" data-tab="tests" onclick="tab('tests')">Test Coverage <span class="c" id="c-tests"></span></div>
</nav>
<main id="view"><div class="loading">initialising cockpit…</div></main>

<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer"></aside>

<script>
const API = location.origin.includes("8787") ? "" : "http://127.0.0.1:8787";
let BOTS=[], ISSUES=[], STATS={}, TAB="fleet";
const SYNC={"in-sync":"var(--green)","drifted":"var(--amber)","unreachable":"var(--red)","unmapped":"var(--faint)"};
const g=(id)=>document.getElementById(id);
const esc=(s)=>(s==null?"":String(s)).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

// canonical issue lanes (normalise messy sheet statuses)
function lane(status){
  const s=(status||"").toLowerCase();
  if(s.includes("flag")) return "Flagged - Backend";
  if(s.includes("fixed for uat")||s==="fixed"||s.includes("fixed,")) return "Fixed for UAT";
  if(s.includes("accept")||s.includes("progress")||s.includes("pending")||s.includes("submit")||s.includes("not pushed")) return "In Progress";
  if(s.includes("closed")||s.includes("reject")||s.includes("done")) return "Closed / Rejected";
  return "Open";
}
const LANES=["Open","In Progress","Fixed for UAT","Flagged - Backend","Closed / Rejected"];

async function load(){
  try{
    [STATS,BOTS,ISSUES]=await Promise.all([
      fetch(API+"/api/stats").then(r=>r.json()),
      fetch(API+"/api/bots").then(r=>r.json()),
      fetch(API+"/api/issues").then(r=>r.json()),
    ]);
  }catch(e){ g("view").innerHTML=`<div class="loading">backend unreachable at ${API||location.origin} — start it with <span class="mono">uvicorn app:app --port 8787</span></div>`; return; }
  renderStats(); g("c-fleet").textContent=BOTS.length;
  g("c-issues").textContent=ISSUES.filter(i=>lane(i.status)!=="Closed / Rejected").length;
  g("c-tests").textContent=STATS.test_runs||0;
  fetch(API+"/api/engine").then(r=>r.json()).then(e=>{ENGINE=e;
    const b=g("ebadge"); b.className="ebadge "+e.mode; b.textContent="engine: "+e.mode.toUpperCase(); b.title=e.note;
    g("engine-banner").innerHTML = e.mode==="real"
      ? `Fix / Test engine: <b style="color:var(--green)">LIVE</b> — ${esc(e.claude_version||"claude")} on your login. Fix buttons run real /bug-fix jobs.`
      : `Fix / Test engine: <b style="color:var(--amber)">SIMULATION</b> — no host <span class="mono">claude</span> CLI found; jobs replay a realistic stream so the full pipeline works. Install <span class="mono">claude</span> (npm i -g @anthropic-ai/claude-code; claude login) to go live.`;
  }).catch(()=>{});
  render();
}
function refresh(){ fetch(API+"/api/ingest/refresh?mode=--all",{method:"POST"}).catch(()=>{}); load(); }

function renderStats(){
  const s=STATS;
  const cells=[
    ["bots",s.bots,""],["deployable",s.bots_deployable,""],
    ["drifted",s.bots_drifted,s.bots_drifted?"bad":"good"],
    ["open P1",s.issues_p1_open,s.issues_p1_open?"bad":"good"],
    ["open",s.issues_open,s.issues_open?"warn":"good"],
    ["backend",s.issues_flagged_backend,s.issues_flagged_backend?"warn":""],
    ["deploys",s.deploys_total,""],["fixes",s.fixes_total,""],
  ];
  g("stats").innerHTML=cells.map(([l,n,c])=>`<div class="stat ${c}"><div class="n">${n??"–"}</div><div class="l">${l}</div></div>`).join("");
}

function tab(t){ TAB=t; document.querySelectorAll(".tab").forEach(e=>e.classList.toggle("active",e.dataset.tab===t)); render(); }
function render(){ if(TAB==="fleet")renderFleet(); else if(TAB==="issues")renderIssues(); else renderTests(); }

function renderFleet(){
  const order=["KKB","DKB","Maya"];
  const groups={};
  BOTS.forEach(b=>{ const k=`${b.agent} · ${b.kind==="conversation"?(b.experimental?"combined (experimental)":"live"):"post-call"}`; (groups[k]=groups[k]||[]).push(b); });
  const keys=Object.keys(groups).sort((a,b)=>order.indexOf(a.split(" ")[0])-order.indexOf(b.split(" ")[0]));
  let h="";
  for(const k of keys){
    h+=`<div class="grp-h">${esc(k)}</div><div class="fleet">`;
    for(const b of groups[k].sort((x,y)=>(y.open_issues-x.open_issues))){
      const col=SYNC[b.sync_state]||"var(--faint)";
      const pips=[];
      if(b.open_p1) pips.push(`<span class="pip p1">P1·${b.open_p1}</span>`);
      if(b.open_issues) pips.push(`<span class="pip">${b.open_issues} open</span>`); else pips.push(`<span class="pip ok">clear</span>`);
      h+=`<div class="card" onclick="openBot('${b.target_id}')">
        <div class="idrow"><span class="sdot" style="background:${col};box-shadow:0 0 8px ${col}"></span>
          <span class="tid">${esc(b.target_id)}</span>
          ${b.experimental?'<span class="chip exp">exp</span>':''}
          <span class="chip">${esc(b.language)}·${esc(b.direction)}</span></div>
        <div class="pips">${pips.join("")}</div>
        <div class="meta"><span class="sync" style="color:${col}">${esc(b.sync_state||"—")}</span>
          <span>dep ${b.last_deploy_at?esc(b.last_deploy_at.slice(5,16)):"—"}</span></div>
      </div>`;
    }
    h+=`</div>`;
  }
  g("view").innerHTML=h;
}

function renderIssues(){
  const buckets={}; LANES.forEach(l=>buckets[l]=[]);
  ISSUES.forEach(i=>buckets[lane(i.status)].push(i));
  const prio=i=>({["p1"]:0,["p2"]:1,["p3"]:2}[(i.priority||"").toLowerCase().slice(0,2)]??3);
  let h='<div class="board">';
  for(const L of LANES){
    const items=buckets[L].sort((a,b)=>prio(a)-prio(b));
    h+=`<div class="lane"><h3>${esc(L)}<span class="k">${items.length}</span></h3>`;
    for(const i of items.slice(0,40)){
      h+=`<div class="icard">
        <div class="t">${esc(i.title||"(untitled)")}</div>
        <div class="r">
          ${i.priority?`<span class="tag pri">${esc(i.priority)}</span>`:""}
          ${i.target_id?`<span class="tag bot">${esc(i.target_id)}</span>`:`<span class="tag">${esc(i.bot_label||"—")}</span>`}
          ${i.d_pattern?`<span class="tag dp">${esc(i.d_pattern)}</span>`:""}
          ${(L==="Open"||L==="In Progress")?`<span class="fixbtn" onclick="event.stopPropagation();fixIssue('${esc(i.issue_id)}')">Fix ▸</span>`:""}
        </div></div>`;
    }
    h+=`</div>`;
  }
  g("view").innerHTML=h+"</div>";
}

function renderTests(){
  const byBot={}; BOTS.filter(b=>b.kind==="conversation").forEach(b=>byBot[b.target_id]={b,runs:[]});
  const covered=ISSUES; // placeholder
  fetch(API+"/api/test-matrix").then(r=>r.json()).then(m=>{
    let h=`<div class="grp-h">Test coverage — ${Object.keys(m.coverage||{}).length} bots exercised · ${STATS.scenarios} scenarios catalogued</div><div class="fleet">`;
    for(const b of BOTS.filter(x=>x.kind==="conversation")){
      const runs=(m.coverage||{})[b.target_id]||[];
      const pass=runs.filter(r=>/pass|fixed/.test(r.result||"")).length;
      const bad=runs.filter(r=>/fail|findings|partial/.test(r.result||"")).length;
      const col=runs.length===0?"var(--faint)":bad?"var(--amber)":"var(--green)";
      h+=`<div class="card" onclick="openBot('${b.target_id}')">
        <div class="idrow"><span class="sdot" style="background:${col};box-shadow:0 0 8px ${col}"></span>
          <span class="tid">${esc(b.target_id)}</span></div>
        <div class="pips"><span class="pip">${runs.length} runs</span>
          ${pass?`<span class="pip ok">${pass}✓</span>`:""}${bad?`<span class="pip p1">${bad}⚠</span>`:""}</div>
        <div class="meta"><span>${runs.length?"tested":"never tested"}</span></div></div>`;
    }
    g("view").innerHTML=h+"</div>";
  });
}

// ---------------- Job Console ----------------
const RAIL=["Find","Root-cause","Classify","Fix","Verify","Deploy","Sheet","Done"];
let WS=null, JOB={op:null,stages:new Set(),active:null,pendingOp:null};

async function fixIssue(id){
  const i=ISSUES.find(x=>x.issue_id===id);
  const r=await fetch(API+"/api/jobs",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({kind:"bugfix",mode:"autonomous",issue_id:id})}).then(r=>r.json()).catch(e=>({error:e}));
  if(r.error||!r.job_id){ alert("could not start job: "+JSON.stringify(r)); return; }
  openConsole(r.operation_id, r.job_id, i?i.title:id);
}

function openConsole(op, jobId, title){
  JOB={op, stages:new Set(), active:null, pendingOp:null, jobId};
  g("scrim").classList.add("open"); g("drawer").classList.add("open");
  g("drawer").innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:start">
      <div><h2>Fix job</h2><div class="muted" style="max-width:400px">${esc(title||op)}</div>
        <div class="verdict mono">${esc(op)} · engine ${ENGINE?ENGINE.mode:"?"}</div></div>
      <button class="btn" onclick="closeConsole()">✕</button></div>
    <div class="sec"><h4>Pipeline</h4><div class="rail" id="rail"></div></div>
    <div class="sec"><h4>Live stream</h4><div class="log" id="log"></div></div>
    <div id="gate"></div>`;
  renderRail();
  if(WS){try{WS.close()}catch(e){}}
  // stream the whole operation (diagnose + auto/approved deploy jobs) via the global feed, filtered by op id
  const wsBase=(API||location.origin).replace(/^http/,"ws");
  WS=new WebSocket(wsBase+"/ws/jobs/*");
  WS.onmessage=(m)=>{ const e=JSON.parse(m.data); if(!e.job_id||!e.job_id.startsWith(op))return; onJobEvent(e); };
}

function onJobEvent(e){
  const log=g("log");
  if(e.kind==="stage"){ JOB.active=e.stage; JOB.stages.add(e.stage); renderRail(); }
  else if(e.kind==="text"){ add(log,`<span class="l-text">${esc(e.text)}</span>`); }
  else if(e.kind==="tool"){ add(log,`<span class="l-tool">▸ ${esc(e.signature||e.tool)}</span>`); }
  else if(e.kind==="tool_result"){ add(log,`<span class="${e.is_error?'l-err':'l-res'}">  ↳ ${esc(e.text||'')}</span>`); }
  else if(e.kind==="result"){ add(log,`<span class="l-res">✓ ${esc(e.summary||'done')}</span>`); }
  else if(e.kind==="verdict"){ /* decision shown via state */ }
  else if(e.kind==="state"){
    if(e.state==="awaiting-approval"){ JOB.pendingOp=JOB.op; renderGate(e); }
    else if(e.state==="done"){ JOB.stages.add("Done"); JOB.active=null; renderRail(); add(log,`<span class="l-res">■ job ${esc(e.job_id.split("-").pop())} done</span>`); loadSoon(); }
    else if(e.state==="running"){ add(log,`<span class="l-text">— ${esc(e.job_id.split("-").pop())} running (${esc(e.engine||e.trigger||"")})</span>`); }
    else if(e.state==="cancelled"){ add(log,`<span class="l-err">✕ rejected — roll back via snapshot</span>`); }
  }
}
function add(el,html){ el.insertAdjacentHTML("beforeend",`<div>${html}</div>`); el.scrollTop=el.scrollHeight; }
function renderRail(){
  const done=JOB.stages;
  g("rail").innerHTML=RAIL.map((s,idx)=>{
    const cls=done.has(s)?"done":(s===JOB.active?"active":"");
    return `<div class="rstep ${cls}"><span class="b">${done.has(s)?"✓":idx+1}</span>${s}</div>`+
      (idx<RAIL.length-1?'<span class="rline"></span>':"");
  }).join("");
}
function renderGate(e){
  g("gate").innerHTML=`<div class="gate"><h4>⏸ Flagged — awaiting your approval</h4>
    <div class="verdict">${esc(e.reason||"")}</div>
    <div class="flags">${(e.flags||[]).map(f=>`<span class="flag">${esc(f)}</span>`).join("")}</div>
    <div class="gbtns"><button class="btn go" onclick="approve()">Approve &amp; deploy ▸</button>
      <button class="btn no" onclick="rejectJob()">Reject</button></div></div>`;
}
async function approve(){ g("gate").innerHTML='<div class="muted">deploying…</div>'; await fetch(API+"/api/operations/"+JOB.pendingOp+"/approve",{method:"POST"}); }
async function rejectJob(){ await fetch(API+"/api/operations/"+JOB.pendingOp+"/reject",{method:"POST"}); g("gate").innerHTML='<div class="muted">rejected.</div>'; }
function closeConsole(){ if(WS){try{WS.close()}catch(e){}} g("scrim").classList.remove("open"); g("drawer").classList.remove("open"); }
let _soon; function loadSoon(){ clearTimeout(_soon); _soon=setTimeout(load,1200); }

async function openBot(id){
  g("scrim").classList.add("open"); g("drawer").classList.add("open");
  g("drawer").innerHTML='<div class="loading">loading…</div>';
  const b=await fetch(API+"/api/bots/"+id).then(r=>r.json());
  const col=SYNC[b.sync_state]||"var(--faint)";
  const rows=(arr,fn)=>arr&&arr.length?arr.slice(0,10).map(fn).join(""):'<div class="muted">none</div>';
  g("drawer").innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:start">
      <div><h2>${esc(b.target_id)}</h2><div class="muted">${esc(b.raya_name||b.file_path||"")}</div></div>
      <button class="btn" onclick="closeDrawer()">✕</button></div>
    <div class="kv">
      <b>agent</b><span>${esc(b.agent)} · ${esc(b.language)} · ${esc(b.direction)} · ${esc(b.kind)}</span>
      <b>sync state</b><span class="mono" style="color:${col}">${esc(b.sync_state||"—")}</span>
      <b>raya id</b><span class="mono">${esc(b.raya_agent_id_prod||"—")}</span>
      <b>open issues</b><span>${(b.issues||[]).filter(i=>lane(i.status)==="Open").length}</span>
      <b>last deploy</b><span class="mono">${esc(b.last_deploy_at||"—")}</span>
    </div>
    <div class="sec"><h4>Open issues</h4>${rows((b.issues||[]).filter(i=>lane(i.status)!=="Closed / Rejected"),i=>`<div class="row"><span class="a">${esc(i.priority||"—")} ${esc(i.d_pattern||"")}</span><span>${esc(i.title)}</span></div>`)}</div>
    <div class="sec"><h4>Recent deploys</h4>${rows(b.deploys,d=>`<div class="row"><span class="a">${esc((d.ts||"").slice(0,16))}</span><span>${esc(d.result)} · ${esc(d.sha256_8||"")}</span></div>`)}</div>
    <div class="sec"><h4>Recent versions</h4>${rows(b.versions,v=>`<div class="row"><span class="a">${esc((v.ts||"").slice(0,16))}</span><span>${esc(v.label)}</span></div>`)}</div>
    <div class="sec"><h4>Test runs</h4>${rows(b.test_runs,t=>`<div class="row"><span class="a">${esc(t.result)}</span><span>${esc((t.notes||"").slice(0,90))}</span></div>`)}</div>`;
}
function closeDrawer(){ if(WS){try{WS.close()}catch(e){}} g("scrim").classList.remove("open"); g("drawer").classList.remove("open"); }
load();
</script>
</body>
</html>
